<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>さんすうチャレンジ 〜小学6年生〜</title>
<style>
  :root {
    --bg: #fff8e7;
    --card: #ffffff;
    --main: #ff8a3d;
    --main-dark: #e5701f;
    --accent: #3bb3a3;
    --ok: #2e9e5b;
    --ok-bg: #e8f7ee;
    --ng: #d8453b;
    --ng-bg: #fdecea;
    --text: #3a3226;
    --muted: #8a7f6d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { text-align: center; font-size: 1.9rem; margin: 12px 0 4px; color: var(--main-dark); }
  .sub { text-align: center; color: var(--muted); margin: 0 0 20px; }
  .card {
    background: var(--card);
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 4px 14px rgba(120, 90, 30, .12);
  }
  .card + .card { margin-top: 16px; }
  .rules { margin: 12px 0 24px; padding-left: 1.4em; }
  .rules li { margin: 4px 0; }
  button {
    font: inherit;
    font-weight: bold;
    border: none;
    border-radius: 999px;
    padding: 14px 32px;
    background: var(--main);
    color: #fff;
    font-size: 1.15rem;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--main-dark);
    transition: transform .05s, box-shadow .05s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--main-dark); }
  button.secondary { background: var(--accent); box-shadow: 0 4px 0 #2a8c7e; }
  .center { text-align: center; }

  /* quiz */
  .progress-text { display: flex; justify-content: space-between; font-weight: bold; color: var(--muted); }
  .bar { height: 12px; background: #f1e6cc; border-radius: 99px; overflow: hidden; margin: 8px 0 20px; }
  .bar > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
  .question {
    font-size: 2.2rem;
    font-weight: bold;
    text-align: center;
    padding: 18px 8px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: .35em;
    word-break: keep-all;
  }
  .op { display: inline-block; padding: 0 .1em; color: var(--main-dark); }
  .qm { color: var(--accent); }
  .frac { display: inline-flex; flex-direction: column; align-items: center; vertical-align: middle; line-height: 1.15; font-size: .95em; }
  .frac .n { border-bottom: .09em solid currentColor; padding: 0 .3em .05em; }
  .frac .d { padding: .05em .3em 0; }
  .answer-row { display: flex; justify-content: center; margin: 8px 0 4px; }
  input[type=text] {
    font: inherit;
    font-size: 1.8rem;
    width: 100%;
    max-width: 320px;
    padding: 10px 16px;
    border: 3px solid #e8d9b5;
    border-radius: 14px;
    text-align: center;
    background: #fffdf7;
    color: var(--text);
  }
  input[type=text]:focus { outline: none; border-color: var(--main); }
  .hint { text-align: center; color: var(--muted); font-size: .9rem; margin: 8px 0 18px; }
  .error { text-align: center; color: var(--ng); font-weight: bold; min-height: 1.6em; margin: 0 0 8px; }

  /* result */
  .score { text-align: center; }
  .score .big { font-size: 3rem; font-weight: bold; color: var(--main-dark); line-height: 1.2; }
  .score .big small { font-size: 1.3rem; color: var(--text); }
  .score .msg { font-size: 1.2rem; margin-top: 6px; }
  .counts { display: flex; justify-content: center; gap: 16px; margin-top: 14px; flex-wrap: wrap; }
  .pill { padding: 6px 18px; border-radius: 99px; font-weight: bold; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); }
  .pill.ng { background: var(--ng-bg); color: var(--ng); }
  .results { list-style: none; margin: 0; padding: 0; }
  .res {
    display: grid;
    grid-template-columns: 52px 1fr;
    gap: 12px;
    align-items: center;
    padding: 14px 14px;
    border-radius: 16px;
    margin-bottom: 12px;
    border: 3px solid transparent;
  }
  .res.ok { background: var(--ok-bg); border-color: #bfe6cd; }
  .res.ng { background: var(--ng-bg); border-color: #f5c3be; }
  .mark { font-size: 2.2rem; font-weight: bold; text-align: center; line-height: 1; }
  .res.ok .mark { color: var(--ok); }
  .res.ng .mark { color: var(--ng); }
  .res .num { font-size: .85rem; color: var(--muted); font-weight: bold; }
  .res .qline { font-size: 1.5rem; font-weight: bold; display: flex; flex-wrap: wrap; align-items: center; gap: .3em; }
  .res .detail { margin-top: 6px; font-size: 1rem; display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; }
  .res .detail .lbl { color: var(--muted); font-size: .85rem; }
  .res .detail b { font-size: 1.15rem; }
  .res.ng .yours b { color: var(--ng); }
  .res .correct b { color: var(--ok); }
  .res .correct .frac, .res .yours .frac { font-size: .9em; }
  .note { color: var(--ng); font-size: .9rem; font-weight: bold; }
  /* quiz layout: 上半分=問題と入力 / 下半分=手書きエリア */
  main.quiz-mode {
    max-width: 900px;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-top: 12px;
    padding-bottom: 12px;
  }
  .quiz-top { padding: 14px 18px; }
  .quiz-top .bar { margin: 6px 0 8px; }
  .quiz-top .question { font-size: 2rem; padding: 6px 8px; }
  .quiz-top .hint { margin: 6px 0 8px; }
  .quiz-top .error { margin: 0 0 6px; min-height: 1.4em; }
  .quiz-top button#submitBtn { padding: 10px 28px; font-size: 1.05rem; }
  .pad {
    flex: 1;
    min-height: 320px;
    display: flex;
    flex-direction: column;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 4px 14px rgba(120, 90, 30, .12);
    overflow: hidden;
  }
  .pad-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: #fff3d6;
  }
  .pad-tools .title { font-weight: bold; color: var(--muted); font-size: .9rem; margin-right: auto; }
  .pad-tools button {
    padding: 6px 14px;
    font-size: .95rem;
    background: #fff;
    color: var(--text);
    border: 2px solid #e8d9b5;
    box-shadow: none;
  }
  .pad-tools button:active { transform: none; box-shadow: none; }
  .pad-tools button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .pad-tools button.swatch { width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px #e8d9b5; }
  .pad-tools button.swatch.active { box-shadow: 0 0 0 3px var(--accent); }
  .pad-canvas {
    position: relative;
    flex: 1;
    min-height: 260px;
    background-color: #fffdf7;
    background-image:
      linear-gradient(#efe3c4 1px, transparent 1px),
      linear-gradient(90deg, #efe3c4 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .pad-canvas canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }
  /* share */
  .share-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 20px; }
  button.line { background: #06c755; box-shadow: 0 4px 0 #05a546; }
  button.line:active { box-shadow: 0 1px 0 #05a546; }
  button.save { background: #fff; color: var(--text); border: 3px solid #e8d9b5; box-shadow: 0 4px 0 #e8d9b5; }
  button.save:active { box-shadow: 0 1px 0 #e8d9b5; }
  button:disabled { opacity: .6; cursor: default; }
  .share-msg { text-align: center; color: var(--muted); font-size: .95rem; min-height: 1.6em; margin: 10px 0 0; }
  @media (max-width: 480px) {
    h1 { font-size: 1.6rem; }
    .quiz-top .question { font-size: 1.6rem; }
    .question { font-size: 1.8rem; }
    .res { grid-template-columns: 40px 1fr; }
    .mark { font-size: 1.8rem; }
  }
</style>
</head>
<body>
<main id="app"></main>

<!-- ===== 問題生成・採点ロジック ===== -->
<script>
const gcd = (a, b) => b ? gcd(b, a % b) : Math.abs(a);
const F = (n, d = 1) => {
  if (d < 0) { n = -n; d = -d; }
  const g = gcd(n, d) || 1;
  return { n: n / g, d: d / g };
};
const fAdd = (a, b) => F(a.n * b.d + b.n * a.d, a.d * b.d);
const fSub = (a, b) => F(a.n * b.d - b.n * a.d, a.d * b.d);
const fMul = (a, b) => F(a.n * b.n, a.d * b.d);
const fDiv = (a, b) => F(a.n * b.d, a.d * b.n);
const fEq  = (a, b) => a.n === b.n && a.d === b.d;
const fGt  = (a, b) => a.n * b.d > b.n * a.d;
const ri = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = arr => arr[ri(0, arr.length - 1)];
const D = (i, k) => F(i, Math.pow(10, k));           // 小数 (整数i を 10^k で割る)

// 有限小数になる分数を小数の文字列に
function decStr(f) {
  let k = 0, p = 1;
  while (p % f.d !== 0) { p *= 10; k++; if (k > 6) throw new Error('not decimal'); }
  let s = String(f.n * (p / f.d));
  if (k > 0) { s = s.padStart(k + 1, '0'); s = s.slice(0, -k) + '.' + s.slice(-k); }
  return s;
}
const fracH = (n, d) => `<span class="frac"><span class="n">${n}</span><span class="d">${d}</span></span>`;
const SYM = { add: '+', sub: '−', mul: '×', div: '÷' };

function mk(op, a, b, ans, type) {
  return {
    op, type, ans,
    html: `${a}<span class="op">${SYM[op]}</span>${b}`,
    kind: ans.d === 1 ? 'int' : (type === 'frac' ? 'frac' : 'dec')
  };
}
function ansHtml(q) {
  if (q.kind === 'frac') return fracH(q.ans.n, q.ans.d);
  if (q.kind === 'dec') return decStr(q.ans);
  return String(q.ans.n);
}

function twoFracs(op) {
  // 通分が必要な、分母の異なる分数を2つ
  let d1, d2;
  do { d1 = ri(2, 9); d2 = ri(2, 9); } while (d1 === d2);
  const a = { n: ri(1, d1 - 1), d: d1 }, b = { n: ri(1, d2 - 1), d: d2 };
  return [a, b];
}
function twoFracsMD() {
  let a, b;
  do {
    a = { n: ri(1, 9), d: ri(2, 9) };
    b = { n: ri(1, 9), d: ri(2, 9) };
  } while (a.n === a.d || b.n === b.d);
  return [a, b];
}

const G = {
  add: {
    int()  { const a = ri(100, 9999), b = ri(100, 9999); return mk('add', a, b, F(a + b), 'int'); },
    dec()  {
      const A = D(ri(11, 999), pick([1, 2])), B = D(ri(11, 999), pick([1, 2]));
      return mk('add', decStr(A), decStr(B), fAdd(A, B), 'dec');
    },
    frac() {
      const [a, b] = twoFracs();
      return mk('add', fracH(a.n, a.d), fracH(b.n, b.d), fAdd(F(a.n, a.d), F(b.n, b.d)), 'frac');
    }
  },
  sub: {
    int()  { const a = ri(1000, 9999), b = ri(100, a - 1); return mk('sub', a, b, F(a - b), 'int'); },
    dec()  {
      let A, B;
      do { A = D(ri(11, 999), pick([1, 2])); B = D(ri(11, 999), pick([1, 2])); } while (!fGt(A, B));
      return mk('sub', decStr(A), decStr(B), fSub(A, B), 'dec');
    },
    frac() {
      let [a, b] = twoFracs();
      for (;;) {
        if (fGt(F(a.n, a.d), F(b.n, b.d))) break;
        if (fGt(F(b.n, b.d), F(a.n, a.d))) { [a, b] = [b, a]; break; }
        [a, b] = twoFracs();
      }
      return mk('sub', fracH(a.n, a.d), fracH(b.n, b.d), fSub(F(a.n, a.d), F(b.n, b.d)), 'frac');
    }
  },
  mul: {
    int()  {
      const [a, b] = pick([() => [ri(12, 99), ri(12, 99)], () => [ri(100, 999), ri(11, 99)]])();
      return mk('mul', a, b, F(a * b), 'int');
    },
    dec()  {
      if (Math.random() < 0.6) {
        const A = D(ri(11, 99), 1), B = D(ri(11, 99), 1);
        return mk('mul', decStr(A), decStr(B), fMul(A, B), 'dec');
      }
      const A = D(ri(12, 99), 1), w = ri(2, 9);
      return mk('mul', decStr(A), w, fMul(A, F(w)), 'dec');
    },
    frac() {
      const [a, b] = twoFracsMD();
      return mk('mul', fracH(a.n, a.d), fracH(b.n, b.d), fMul(F(a.n, a.d), F(b.n, b.d)), 'frac');
    }
  },
  div: {
    int()  {
      const [d, q] = pick([() => [ri(2, 9), ri(100, 999)], () => [ri(11, 48), ri(11, 99)]])();
      return mk('div', d * q, d, F(q), 'int');
    },
    dec()  {
      if (Math.random() < 0.65) {
        const Dv = D(ri(12, 99), 1), Q = D(ri(2, 50), pick([0, 1]));
        return mk('div', decStr(fMul(Dv, Q)), decStr(Dv), Q, 'dec');
      }
      const w = ri(2, 9), Q = D(ri(11, 99), 1);
      return mk('div', decStr(fMul(F(w), Q)), w, Q, 'dec');
    },
    frac() {
      const [a, b] = twoFracsMD();
      return mk('div', fracH(a.n, a.d), fracH(b.n, b.d), fDiv(F(a.n, a.d), F(b.n, b.d)), 'frac');
    }
  }
};

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = ri(0, i);
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateQuestions() {
  const ops = shuffle(['add', 'add', 'sub', 'sub', 'mul', 'mul', 'mul', 'div', 'div', 'div']);
  const seen = new Set();
  return ops.map(op => {
    let q, t = 0;
    do { q = G[op][pick(['int', 'dec', 'frac'])](); } while (seen.has(q.html) && ++t < 30);
    seen.add(q.html);
    return q;
  });
}

// 全角→半角などの正規化
function normalize(s) {
  return s
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[．。]/g, '.')
    .replace(/[／]/g, '/')
    .replace(/\s+/g, '');
}
function parseAnswer(raw) {
  const s = normalize(raw);
  if (s.length === 0 || s.length > 12) return null;
  let m;
  if (/^\d+$/.test(s)) return { f: F(parseInt(s, 10)), frac: null, text: s };
  if ((m = /^(\d+)\.(\d+)$/.exec(s))) {
    if (m[2].length > 4) return null;
    return { f: F(parseInt(m[1] + m[2], 10), Math.pow(10, m[2].length)), frac: null, text: s };
  }
  if ((m = /^(\d+)\/(\d+)$/.exec(s))) {
    const n = parseInt(m[1], 10), d = parseInt(m[2], 10);
    if (d === 0) return null;
    return { f: F(n, d), frac: { n, d }, text: s };
  }
  return null;
}
function grade(q, raw) {
  const p = parseAnswer(raw);
  if (!p) return null;                                   // 入力形式が不正
  const same = fEq(p.f, q.ans);
  const reduced = !p.frac || gcd(p.frac.n, p.frac.d) === 1;
  return { ok: same && reduced, text: p.text, note: (same && !reduced) ? '分数は約分しましょう' : '' };
}
</script>

<!-- ===== 画面 ===== -->
<script>
const app = document.getElementById('app');
const TOTAL = 10;
let state = { qs: [], i: 0, results: [] };

const HINTS = {
  int:  '整数で入力してね。',
  dec:  '小数で入力してね。(整数になるときは整数で)',
  frac: '分数は「3/4」のように入力してね。約分もわすれずに!(仮分数のままでOK。整数になるときは整数で)'
};

function renderStart() {
  app.className = '';
  app.innerHTML = `
    <h1>🧮 さんすうチャレンジ</h1>
    <p class="sub">小学6年生 けいさんドリル</p>
    <section class="card">
      <h2 style="margin-top:0">あそびかた</h2>
      <ul class="rules">
        <li>たし算・ひき算・かけ算・わり算の問題が <b>10問</b> 出ます。</li>
        <li>1問ずつ答えを入力して「こたえる」をおしてね。</li>
        <li>整数・小数・分数の問題があるよ。</li>
        <li>分数の答えは「3/4」のように書いて、約分もしてね。</li>
        <li>10問おわったら、○×つきの結果が見られるよ。</li>
      </ul>
      <div class="center"><button id="startBtn">はじめる</button></div>
    </section>`;
  document.getElementById('startBtn').onclick = startQuiz;
}

function startQuiz() {
  state = { qs: generateQuestions(), i: 0, results: [] };
  renderQuestion();
}

// 手書きメモ欄(文字認識はしない。ただ書くだけ)。問題ごとに新しいメモ欄になる。
function initPad() {
  const wrap = document.getElementById('padWrap');
  const cv = document.getElementById('pad');
  const ctx = cv.getContext('2d');
  const tools = document.querySelector('.pad-tools');
  const WIDTH = { pen: 3, eraser: 26 };
  let strokes = [], cur = null, tool = 'pen', color = '#2b2b2b', dpr = 1, rect = null;

  function styleFor(s) {
    ctx.globalCompositeOperation = s.tool === 'eraser' ? 'destination-out' : 'source-over';
    ctx.strokeStyle = s.color; ctx.fillStyle = s.color;
    ctx.lineWidth = s.w; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  }
  function drawDot(s, p) {
    styleFor(s); ctx.beginPath(); ctx.arc(p.x, p.y, s.w / 2, 0, Math.PI * 2); ctx.fill();
  }
  function drawSeg(s, a, b) {
    styleFor(s); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  function redraw() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const s of strokes) {
      if (s.points.length === 1) { drawDot(s, s.points[0]); continue; }
      for (let i = 1; i < s.points.length; i++) drawSeg(s, s.points[i - 1], s.points[i]);
    }
  }
  function resize() {
    const r = wrap.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    redraw();                       // 線のデータから描き直すので、画面サイズが変わっても消えない
  }
  const pt = (e) => ({ x: e.clientX - rect.left, y: e.clientY - rect.top });

  cv.addEventListener('pointerdown', e => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    e.preventDefault();
    cv.setPointerCapture(e.pointerId);
    rect = cv.getBoundingClientRect();
    const p = pt(e);
    cur = { tool, color, w: WIDTH[tool], points: [p] };
    strokes.push(cur);
    drawDot(cur, p);
  });
  cv.addEventListener('pointermove', e => {
    if (!cur) return;
    e.preventDefault();
    const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    for (const ev of (evs.length ? evs : [e])) {
      const p = pt(ev), prev = cur.points[cur.points.length - 1];
      cur.points.push(p);
      drawSeg(cur, prev, p);
    }
  });
  const end = () => { cur = null; };
  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);
  cv.addEventListener('contextmenu', e => e.preventDefault());

  tools.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.color) { tool = 'pen'; color = b.dataset.color; }
    else if (b.dataset.tool === 'eraser') { tool = 'eraser'; }
    else return;
    tools.querySelectorAll('.swatch, [data-tool]').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  });
  document.getElementById('padUndo').onclick = () => { strokes.pop(); redraw(); };
  document.getElementById('padClear').onclick = () => {
    if (strokes.length === 0) return;
    if (confirm('かいたものを ぜんぶ けしてもいい?')) { strokes = []; redraw(); }
  };

  if (window.ResizeObserver) new ResizeObserver(resize).observe(wrap);
  else { window.addEventListener('resize', resize); resize(); }
}

function renderQuestion() {
  const q = state.qs[state.i];
  const isLast = state.i === TOTAL - 1;
  app.className = 'quiz-mode';
  app.innerHTML = `
    <section class="card quiz-top">
      <div class="progress-text"><span>第 ${state.i + 1} 問</span><span>${state.i + 1} / ${TOTAL}</span></div>
      <div class="bar"><div style="width:${(state.i / TOTAL) * 100}%"></div></div>
      <div class="question">${q.html}<span class="op">＝</span><span class="qm">？</span></div>
      <div class="answer-row">
        <input id="ans" type="text" inputmode="text" autocomplete="off" autocapitalize="off"
               spellcheck="false" aria-label="こたえ" placeholder="こたえを入力">
      </div>
      <p class="hint">${HINTS[q.type === 'frac' ? 'frac' : q.type === 'dec' ? 'dec' : 'int']}</p>
      <p class="error" id="err" role="alert"></p>
      <div class="center"><button id="submitBtn">${isLast ? 'こたえて けっかを見る' : 'こたえる'}</button></div>
    </section>
    <section class="pad" aria-label="ひっ算・計算用のメモ">
      <div class="pad-tools">
        <span class="title">✏️ ここで ひっ算しよう</span>
        <button type="button" class="swatch active" data-color="#2b2b2b" style="background:#2b2b2b" aria-label="くろ"></button>
        <button type="button" class="swatch" data-color="#d8453b" style="background:#d8453b" aria-label="あか"></button>
        <button type="button" class="swatch" data-color="#2f6fdb" style="background:#2f6fdb" aria-label="あお"></button>
        <button type="button" data-tool="eraser">けしゴム</button>
        <button type="button" id="padUndo">ひとつもどす</button>
        <button type="button" id="padClear">ぜんぶけす</button>
      </div>
      <div class="pad-canvas" id="padWrap"><canvas id="pad"></canvas></div>
    </section>`;
  initPad();
  const input = document.getElementById('ans');
  // タッチ端末ではキーボードが手書きエリアを隠すので、自動フォーカスはしない
  if (window.matchMedia && window.matchMedia('(pointer: fine)').matches) input.focus();
  const submit = () => {
    const g = grade(q, input.value);
    if (!g) {
      document.getElementById('err').textContent =
        input.value.trim() === '' ? 'こたえを入力してね。' : '数字、小数(1.5)、分数(3/4)の形で入力してね。';
      input.focus();
      return;
    }
    state.results.push({ q, ...g });
    state.i++;
    if (state.i >= TOTAL) renderResult(); else renderQuestion();
  };
  document.getElementById('submitBtn').onclick = submit;
  input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) submit(); });
}

function message(score) {
  if (score === 10) return '🎉 ぜんぶ せいかい! かんぺきだね!';
  if (score >= 8) return '✨ すばらしい! あと少しで まんてん!';
  if (score >= 6) return '👍 よくできました! まちがえた問題を見なおそう。';
  if (score >= 4) return '💪 がんばったね! もういちどチャレンジしよう。';
  return '🌱 ここから ぐんぐん のびるよ! ゆっくり やってみよう。';
}

function renderResult() {
  app.className = '';
  const score = state.results.filter(r => r.ok).length;
  const items = state.results.map((r, idx) => `
    <li class="res ${r.ok ? 'ok' : 'ng'}">
      <div class="mark">${r.ok ? '○' : '×'}</div>
      <div>
        <div class="num">第 ${idx + 1} 問</div>
        <div class="qline">${r.q.html}<span class="op">＝</span><span class="qm">？</span></div>
        <div class="detail">
          <span class="yours"><span class="lbl">あなたの答え</span> <b>${r.text}</b></span>
          ${r.ok ? '' : `<span class="correct"><span class="lbl">せいかいの答え</span> <b>${ansHtml(r.q)}</b></span>`}
          ${r.note ? `<span class="note">${r.note}</span>` : ''}
        </div>
      </div>
    </li>`).join('');
  app.innerHTML = `
    <h1>🧮 けっか発表</h1>
    <section class="card score">
      <div class="big">${score}<small> / ${TOTAL} 問 せいかい</small></div>
      <div class="msg">${message(score)}</div>
      <div class="counts">
        <span class="pill ok">○ せいかい ${score} 問</span>
        <span class="pill ng">× まちがい ${TOTAL - score} 問</span>
      </div>
      <div class="share-row">
        <button id="shareBtn" class="line" type="button">📤 LINEなどで シェア</button>
        <button id="saveBtn" class="save" type="button">🖼 画像をほぞん</button>
      </div>
      <p class="share-msg" id="shareMsg" role="status"></p>
    </section>
    <section class="card">
      <h2 style="margin-top:0">問題と答えあわせ</h2>
      <ul class="results">${items}</ul>
      <div class="center"><button id="retryBtn" class="secondary">もういちど あたらしい問題で あそぶ</button></div>
    </section>`;
  document.getElementById('retryBtn').onclick = startQuiz;
  // 画像は先に作っておく(ボタンを押した瞬間にシェアできるように)
  state.shareBlob = null;
  state.sharePromise = buildResultImage(state.results, score)
    .then(b => (state.shareBlob = b))
    .catch(() => null);
  document.getElementById('shareBtn').onclick = () => shareResult(score);
  document.getElementById('saveBtn').onclick = () => saveResult();
  window.scrollTo(0, 0);
}

/* ===== けっか画像(スクリーンショット)づくり ===== */
const IMG_FONT = '"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif';
const C = {
  bg: '#fff8e7', card: '#ffffff', main: '#e5701f', text: '#3a3226', muted: '#8a7f6d', accent: '#3bb3a3',
  ok: '#2e9e5b', okBg: '#e8f7ee', okLine: '#bfe6cd', ng: '#d8453b', ngBg: '#fdecea', ngLine: '#f5c3be'
};

// 問題・答えの HTML を「文字」と「分数」の並びに分解する
function toTokens(html) {
  const out = [];
  const re = /<span class="frac"><span class="n">(\d+)<\/span><span class="d">(\d+)<\/span><\/span>|<span class="op">([^<]*)<\/span>|([0-9.]+)/g;
  let m;
  while ((m = re.exec(html))) {
    if (m[1]) out.push({ frac: [m[1], m[2]] });
    else if (m[3]) out.push({ text: m[3], op: true });
    else out.push({ text: m[4] });
  }
  return out;
}
const hasFrac = t => t.some(x => x.frac);

function drawTokens(ctx, tokens, x, midY, size, color) {
  const gap = size * 0.28;
  let cx = x;
  ctx.textBaseline = 'middle';
  tokens.forEach((t, i) => {
    if (i) cx += gap;
    if (t.frac) {
      const fs = size * 0.9;
      ctx.font = `bold ${fs}px ${IMG_FONT}`;
      const w = Math.max(ctx.measureText(t.frac[0]).width, ctx.measureText(t.frac[1]).width) + size * 0.4;
      ctx.fillStyle = color; ctx.strokeStyle = color;
      ctx.textAlign = 'center';
      ctx.fillText(t.frac[0], cx + w / 2, midY - fs * 0.58);
      ctx.fillText(t.frac[1], cx + w / 2, midY + fs * 0.62);
      ctx.lineWidth = Math.max(2, size * 0.07);
      ctx.lineCap = 'butt';
      ctx.beginPath(); ctx.moveTo(cx, midY); ctx.lineTo(cx + w, midY); ctx.stroke();
      ctx.textAlign = 'left';
      cx += w;
    } else {
      ctx.font = `bold ${size}px ${IMG_FONT}`;
      ctx.textAlign = 'left';
      ctx.fillStyle = t.op ? C.main : t.q ? C.accent : color;
      ctx.fillText(t.text, cx, midY);
      cx += ctx.measureText(t.text).width;
    }
  });
  return cx - x;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

async function buildResultImage(results, score) {
  const W = 800, S = 2, M = 32, ROW_GAP = 12, LIST_TOP = 410;

  // 1) 各行の高さを先に計算
  const rows = results.map(r => {
    const qt = toTokens(r.q.html).concat([{ text: '＝', op: true }, { text: '？', q: true }]);
    const ct = r.ok ? null : toTokens(ansHtml(r.q));
    const eh = hasFrac(qt) ? 36 : 22;
    const eh2 = ct && hasFrac(ct) ? 26 : 15;
    let y = 16;
    const labelY = y + 10; y += 26;
    const exprY = y + eh;  y += 2 * eh + 8;
    const detY = y + eh2;  y += 2 * eh2;
    let noteY = null;
    if (r.note) { y += 8; noteY = y + 10; y += 20; }
    y += 16;
    return { r, qt, ct, labelY, exprY, detY, noteY, h: y };
  });
  const H = LIST_TOP + rows.reduce((s, L) => s + L.h + ROW_GAP, 0) + 44;

  // 2) 描く
  const cv = document.createElement('canvas');
  cv.width = W * S; cv.height = H * S;
  const ctx = cv.getContext('2d');
  ctx.scale(S, S);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.main; ctx.font = `bold 36px ${IMG_FONT}`;
  ctx.fillText('🧮 さんすうチャレンジ けっか', W / 2, 60);
  ctx.fillStyle = C.muted; ctx.font = `bold 18px ${IMG_FONT}`;
  const dateStr = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric' });
  ctx.fillText(`${dateStr} ・ 小学6年生 けいさんドリル`, W / 2, 100);

  // スコアカード
  ctx.save();
  ctx.shadowColor = 'rgba(120,90,30,.15)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
  ctx.fillStyle = C.card; roundRect(ctx, M, 130, W - 2 * M, 210, 24); ctx.fill();
  ctx.restore();
  ctx.textAlign = 'center';
  ctx.fillStyle = C.main; ctx.font = `bold 56px ${IMG_FONT}`;
  ctx.fillText(`${score} / ${TOTAL} 問 せいかい`, W / 2, 190);
  ctx.fillStyle = C.text; ctx.font = `bold 24px ${IMG_FONT}`;
  ctx.fillText(message(score), W / 2, 250);
  const pills = [
    { t: `○ せいかい ${score} 問`, fg: C.ok, bg: C.okBg },
    { t: `× まちがい ${TOTAL - score} 問`, fg: C.ng, bg: C.ngBg }
  ];
  pills.forEach((p, i) => {
    const px = W / 2 - 210 + i * 220;
    ctx.fillStyle = p.bg; roundRect(ctx, px, 282, 200, 40, 20); ctx.fill();
    ctx.fillStyle = p.fg; ctx.font = `bold 20px ${IMG_FONT}`;
    ctx.fillText(p.t, px + 100, 303);
  });

  ctx.fillStyle = C.text; ctx.font = `bold 24px ${IMG_FONT}`;
  ctx.fillText('問題と答えあわせ', W / 2, 378);

  // 各問題
  let top = LIST_TOP;
  rows.forEach((L, i) => {
    const { r } = L;
    ctx.fillStyle = r.ok ? C.okBg : C.ngBg;
    roundRect(ctx, M, top, W - 2 * M, L.h, 20); ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = r.ok ? C.okLine : C.ngLine; ctx.stroke();

    const mx = M + 50, my = top + L.h / 2;
    ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.strokeStyle = r.ok ? C.ok : C.ng;
    ctx.beginPath();
    if (r.ok) ctx.arc(mx, my, 22, 0, Math.PI * 2);
    else { ctx.moveTo(mx - 20, my - 20); ctx.lineTo(mx + 20, my + 20); ctx.moveTo(mx + 20, my - 20); ctx.lineTo(mx - 20, my + 20); }
    ctx.stroke();

    const tx = M + 100;
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillStyle = C.muted; ctx.font = `bold 16px ${IMG_FONT}`;
    ctx.fillText(`第 ${i + 1} 問`, tx, top + L.labelY);

    drawTokens(ctx, L.qt, tx, top + L.exprY, 32, C.text);

    let dx = tx;
    const dy = top + L.detY;
    ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
    ctx.fillStyle = C.muted; ctx.font = `bold 16px ${IMG_FONT}`;
    ctx.fillText('あなたの答え', dx, dy);
    dx += ctx.measureText('あなたの答え').width + 10;
    ctx.fillStyle = r.ok ? C.ok : C.ng; ctx.font = `bold 24px ${IMG_FONT}`;
    ctx.fillText(r.text, dx, dy);
    dx += ctx.measureText(r.text).width + 28;
    if (!r.ok) {
      ctx.fillStyle = C.muted; ctx.font = `bold 16px ${IMG_FONT}`;
      ctx.fillText('せいかいの答え', dx, dy);
      dx += ctx.measureText('せいかいの答え').width + 10;
      drawTokens(ctx, L.ct, dx, dy, 24, C.ok);
    }
    if (r.note) {
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.fillStyle = C.ng; ctx.font = `bold 16px ${IMG_FONT}`;
      ctx.fillText(r.note, tx, top + L.noteY);
    }
    top += L.h + ROW_GAP;
  });

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = C.muted; ctx.font = `bold 16px ${IMG_FONT}`;
  ctx.fillText('さんすうチャレンジ 〜小学6年生〜', W / 2, H - 24);

  return new Promise((resolve, reject) =>
    cv.toBlob(b => (b ? resolve(b) : reject(new Error('toBlob failed'))), 'image/png'));
}

/* ===== シェア・ほぞん ===== */
function setShareMsg(t) { const el = document.getElementById('shareMsg'); if (el) el.textContent = t; }

function downloadBlob(blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'sansu-result.png';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}

async function saveResult() {
  const blob = state.shareBlob || await state.sharePromise;
  if (!blob) { setShareMsg('画像をつくれませんでした。もういちど ためしてね。'); return; }
  downloadBlob(blob);
  setShareMsg('画像をほぞんしました。');
}

async function shareResult(score) {
  setShareMsg('');
  // すでにできていれば await せずに、そのままシェアを呼ぶ(タップ直後でないと開けない端末があるため)
  const blob = state.shareBlob || await state.sharePromise;
  if (!blob) { setShareMsg('画像をつくれませんでした。もういちど ためしてね。'); return; }
  const file = new File([blob], 'sansu-result.png', { type: 'image/png' });
  const data = { files: [file], title: 'さんすうチャレンジ', text: `さんすうチャレンジ ${score} / ${TOTAL} 問 せいかい!` };
  if (navigator.share && navigator.canShare && navigator.canShare(data)) {
    try {
      await navigator.share(data);
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;     // 自分でキャンセルしたとき
    }
  }
  // シェアできない環境(パソコンなど): 画像をほぞんして、LINEで送ってもらう
  downloadBlob(blob);
  setShareMsg('この ブラウザでは 直接シェアできないので、画像をほぞんしました。LINEをひらいて、その画像を送ってね。');
}

renderStart();
